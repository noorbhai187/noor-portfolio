# Supabase's free plan pauses a project after ~7 days without activity, which breaks the
# contact form. A tiny read every 3 days keeps it awake. Uses the public values already in
# frontend/.env.production (the anon key ships in the site's JavaScript anyway).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every third day
  workflow_dispatch:          # "Run workflow" button for a manual check

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/.env.production
          sparse-checkout-cone-mode: false
      - name: Ping database
        run: |
          set -a; . frontend/.env.production; set +a
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/contact_messages?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY")
          echo "Supabase responded $code"
          test "$code" = 200
